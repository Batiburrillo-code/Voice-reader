<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Lector TTS</title>
  <style>
    /* Popup oscuro y amigable, con acento morado */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      background: linear-gradient(180deg, #1d1d26, #17171d 60%);
      color: #e9e9ef;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      font-size: 13px;
      padding: 14px 14px 12px;
    }
    h1 {
      font-size: 15px; font-weight: 700; color: #fff;
      display: flex; align-items: center; gap: 9px; margin-bottom: 13px;
    }
    .logo {
      width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(135deg, #7c5cff, #5a8bff);
      display: grid; place-items: center; font-size: 14px;
      box-shadow: 0 3px 10px rgba(124, 92, 255, .35);
    }
    label { display: block; font-size: 11px; color: #9a9aac; margin: 11px 0 5px; letter-spacing: .2px; }
    select {
      width: 100%; padding: 9px; border-radius: 10px;
      border: 1px solid #3a3a4e; background: #262633; color: #e9e9ef;
      font-size: 12.5px; cursor: pointer;
    }
    select:hover { background: #2c2c3b; }

    /* Slider + contadores de −/+ 0.1 */
    .fila-slider { display: flex; align-items: center; gap: 7px; }
    .fila-slider output { min-width: 40px; text-align: right; color: #fff; font-weight: 650; font-size: 12.5px; }
    .paso {
      appearance: none; border: 1px solid #3a3a4e; background: #262633;
      color: #e9e9ef; border-radius: 8px; cursor: pointer;
      width: 26px; height: 26px; font-size: 14px; font-weight: 700; line-height: 1;
      transition: background .15s;
    }
    .paso:hover { background: #363648; }
    input[type="range"] {
      flex: 1; appearance: none; -webkit-appearance: none; height: 6px;
      background: linear-gradient(90deg, #7c5cff, #5a8bff) no-repeat #343442;
      background-size: 30% 100%;
      border-radius: 3px; outline: none; cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 17px; height: 17px; border-radius: 50%;
      background: #fff; border: 3px solid #7c5cff; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    }
    input[type="range"]::-moz-range-thumb {
      width: 13px; height: 13px; border-radius: 50%;
      background: #fff; border: 3px solid #7c5cff; cursor: pointer;
    }
    /* Control desactivado (p. ej. el tono con una voz neuronal): gris e inútil */
    input[type="range"]:disabled { opacity: .4; cursor: not-allowed; }
    .paso:disabled { opacity: .4; cursor: not-allowed; }
    .paso:disabled:hover { background: #262633; }
    .fila-slider.desactivado output { opacity: .4; }
    label.desactivado { opacity: .55; }

    .botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    button {
      appearance: none; border: 1px solid #3a3a4e; border-radius: 11px;
      background: #262633; color: #e9e9ef; cursor: pointer;
      padding: 10px 8px; font-size: 12.5px; font-weight: 600;
      transition: background .15s, filter .15s;
    }
    button:hover { background: #363648; }
    .primario {
      background: linear-gradient(135deg, #7c5cff, #5a8bff);
      border-color: transparent; color: #fff;
    }
    .primario:hover { filter: brightness(1.12); }
    .transporte { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .transporte button { font-size: 15px; padding: 9px 4px; }
    #btn-clic { margin-top: 8px; width: 100%; }
    button.activo { background: linear-gradient(135deg, #7c5cff, #5a8bff); border-color: transparent; color: #fff; }
    button.activo:hover { filter: brightness(1.12); }
    #btn-pdf, #btn-permisos { display: none; margin-top: 8px; width: 100%; }
    #btn-pdf { background: linear-gradient(135deg, #e2574a, #b3453a); border-color: transparent; color: #fff; }
    #btn-pdf:hover { filter: brightness(1.1); }
    #estado {
      margin-top: 10px; min-height: 16px; font-size: 11.5px;
      color: #9a9aac; line-height: 1.45;
    }
    #estado.error { color: #ff9d8f; }
    .pie {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid #2c2c36;
      font-size: 10.5px; color: #6e6e80; line-height: 1.5;
    }
    kbd {
      background: #262633; border: 1px solid #3a3a4e; border-radius: 4px;
      padding: 0 4px; font-family: inherit;
    }
  </style>
</head>
<body>
  <h1><span class="logo">🔊</span> Lector TTS</h1>

  <!-- Selector de voz: neuronales arriba, luego español del sistema -->
  <label for="sel-voz">Voz</label>
  <select id="sel-voz"></select>

  <!-- Velocidad: de 0.5× a 5×, con contadores de 0.1 en 0.1 -->
  <label for="rango-vel">Velocidad</label>
  <div class="fila-slider">
    <button class="paso" id="btn-vel-menos" title="Bajar 0.1">−</button>
    <input type="range" id="rango-vel" min="0.5" max="5" step="0.1" value="1.1">
    <button class="paso" id="btn-vel-mas" title="Subir 0.1">+</button>
    <output id="txt-vel">1.1×</output>
  </div>

  <!-- Tono de la voz (voces del sistema), con contadores. Se desactiva en gris
       al elegir una voz neuronal, que no admite cambio de tono. -->
  <label for="rango-tono" id="lbl-tono">Tono <span style="color:#6e6e80">(voces del sistema)</span></label>
  <div class="fila-slider" id="fila-tono">
    <button class="paso" id="btn-tono-menos" title="Bajar 0.1">−</button>
    <input type="range" id="rango-tono" min="0.5" max="2" step="0.1" value="1">
    <button class="paso" id="btn-tono-mas" title="Subir 0.1">+</button>
    <output id="txt-tono">1.0</output>
  </div>

  <!-- Acciones principales -->
  <div class="botones">
    <button id="btn-leer-pagina" class="primario">▶ Leer página</button>
    <button id="btn-leer-seleccion">🔊 Leer selección</button>
  </div>

  <!-- Transporte: anterior / pausa-reanudar / detener / siguiente -->
  <div class="transporte">
    <button id="btn-anterior" title="Oración anterior">⏮</button>
    <button id="btn-pausa" title="Pausar / Reanudar">⏯</button>
    <button id="btn-detener" title="Detener">⏹</button>
    <button id="btn-siguiente" title="Oración siguiente">⏭</button>
  </div>

  <!-- Modo "leer al hacer clic": al activarlo, en la página basta tocar un
       texto para leerlo desde ahí (o usa Alt+clic sin activar nada). -->
  <button id="btn-clic">👆 Leer al hacer clic</button>

  <!-- Solo aparece si la pestaña actual es un PDF -->
  <button id="btn-pdf">📄 Leer este PDF en el lector</button>

  <!-- Solo aparece en Firefox si falta el permiso de acceso a los sitios -->
  <button id="btn-permisos">🔓 Conceder acceso a los sitios web</button>

  <div id="estado"></div>

  <div class="pie">
    Atajos: <kbd>Alt</kbd>+<kbd>L</kbd> lee la selección · <kbd>Alt</kbd>+clic en un texto lo lee desde ahí · Clic derecho → «🔊 Leer selección»
  </div>

  <script src="speech-engine.js"></script>
  <script src="popup.js"></script>
</body>
</html>
